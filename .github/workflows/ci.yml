name: SNCK Panel CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]
        database: ["mariadb:11.4", "mysql:8.4"]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip, intl, sodium, pcntl
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP formatting
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Prepare test environment
        run: cp .env.ci .env

      - name: Run unit tests
        run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit
        env:
          DB_HOST: UNIT_NO_DB

      - name: Run database integration tests
        run: vendor/bin/phpunit tests/Integration
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Audit Composer dependencies
        run: composer audit

      - name: Check installer scripts and branding tool
        run: |
          bash -n install.sh
          bash install.sh --help
          bash -n node-install.sh
          bash node-install.sh --help
          python3 -m py_compile scripts/rebrand-pterodactyl.py

  frontend:
    name: React frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check frontend
        run: yarn tsc

      - name: Lint frontend
        run: yarn lint

      - name: Build production assets
        run: yarn build:production

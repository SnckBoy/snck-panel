name: SNCK PANEL CI

on:
  push:
    branches:
      - main
      - "repair/**"
      - "security/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install panel dependencies
        run: npm ci

      - name: Report all panel dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test theme validation and lifecycle rules
        run: npm test

      - name: Lint panel
        run: npm run lint

      - name: Build panel
        run: npm run build

      - name: Install node daemon dependencies
        working-directory: node-daemon
        run: npm ci

      - name: Report all node daemon dependency vulnerabilities
        working-directory: node-daemon
        run: npm audit --audit-level=high || true

      - name: Audit node daemon production dependencies
        working-directory: node-daemon
        run: npm audit --omit=dev --audit-level=high

      - name: Build node daemon
        working-directory: node-daemon
        run: npm run build

      - name: Shell syntax checks
        run: |
          bash -n install.sh
          bash -n scripts/snck-menu.sh
          bash -n scripts/install-panel.sh
          bash -n scripts/panel-service.sh
          bash -n scripts/test-service-fallback.sh
          bash scripts/test-service-fallback.sh
          bash -n node-install.sh
          bash -n shironex

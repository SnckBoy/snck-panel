name: SNCK PANEL CI

on:
  push:
    branches:
      - main
      - "repair/**"
      - "security/**"
      - "php-migration-final"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install panel dependencies
        run: npm ci

      - name: Report all panel dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test theme and Discord rewards behavior
        run: npm test

      - name: Lint panel
        run: npm run lint

      - name: Build panel
        run: npm run build

      - name: Install node daemon dependencies
        working-directory: node-daemon
        run: npm ci

      - name: Report all node daemon dependency vulnerabilities
        working-directory: node-daemon
        run: npm audit --audit-level=high || true

      - name: Audit node daemon production dependencies
        working-directory: node-daemon
        run: npm audit --omit=dev --audit-level=high

      - name: Build node daemon
        working-directory: node-daemon
        run: npm run build

      - name: Test node daemon SFTP protocol and jail
        working-directory: node-daemon
        run: npm test

      - name: Shell syntax checks
        run: |
          bash -n install.sh
          bash install.sh --help
          bash -n scripts/snck-menu.sh
          bash -n scripts/install-panel.sh
          bash -n scripts/panel-service.sh
          bash -n scripts/test-service-fallback.sh
          bash scripts/test-service-fallback.sh
          bash -n node-install.sh
          bash node-install.sh --help
          bash -n shironex
          bash -n scripts/install-laravel-panel.sh
          bash scripts/install-laravel-panel.sh --help
          bash -n scripts/smoke-test.sh

  laravel:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snck_panel_test
          POSTGRES_USER: snck_panel
          POSTGRES_PASSWORD: snck_panel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snck_panel -d snck_panel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: laravel-panel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, pgsql, zip, intl, bcmath, pcntl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laravel-panel/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

      - name: Analyze PHP types
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1G --no-progress

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Laravel frontend
        run: npm run build

      - name: Run Laravel tests against PostgreSQL
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: snck_panel_test
          DB_USERNAME: snck_panel
          DB_PASSWORD: snck_panel
        run: php artisan test

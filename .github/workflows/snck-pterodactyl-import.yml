name: Import Pterodactyl v1.15.2 as SNCK

on:
  push:
    branches:
      - bootstrap/snck-pterodactyl-import

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: snck-pterodactyl-import
  cancel-in-progress: false

jobs:
  import-upstream:
    name: Create isolated SNCK fork branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out import bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare pinned upstream source
        env:
          UPSTREAM_COMMIT: 90b2aa87469da4fffd941b3c99f3c1ca48a01b78
        run: |
          set -euo pipefail
          cp scripts/rebrand-pterodactyl.py "$RUNNER_TEMP/rebrand-pterodactyl.py"
          git clone --filter=blob:none https://github.com/pterodactyl/panel.git "$RUNNER_TEMP/pterodactyl"
          git -C "$RUNNER_TEMP/pterodactyl" checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C "$RUNNER_TEMP/pterodactyl" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test -s "$RUNNER_TEMP/pterodactyl/LICENSE.md"

      - name: Build isolated SNCK fork branch
        env:
          TARGET_BRANCH: feat/snck-pterodactyl-v1.15.2
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create "$TARGET_BRANCH" origin/main
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/pterodactyl/" "$GITHUB_WORKSPACE/"
          mkdir -p scripts
          cp "$RUNNER_TEMP/rebrand-pterodactyl.py" scripts/rebrand-pterodactyl.py
          python3 scripts/rebrand-pterodactyl.py "$GITHUB_WORKSPACE"
          test -s LICENSE.md
          test -s SNCK_UPSTREAM.md
          test -s public/assets/svgs/snck.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Pterodactyl Panel v1.15.2 as SNCK"
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: feat/snck-pterodactyl-v1.15.2
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          ## What this branch does

          - Imports the exact Pterodactyl Panel v1.15.2 source commit supplied for this project.
          - Applies conservative SNCK branding to the app name, login screen, footer, admin links and console prompt.
          - Preserves the upstream MIT licence and copyright notice in LICENSE.md.
          - Preserves upstream internal namespaces, database keys, API contracts and Wings paths for compatibility.

          ## Important architecture

          The panel is PHP/Laravel with a React/TypeScript client. Game nodes require the separate Go-based Wings service. The previous SNCK TypeScript daemon is not a compatible substitute and is intentionally not installed by this branch.

          ## Not production-ready yet

          This is an isolated source-import draft. The SNCK one-command installer, matching Wings node installer, clean Ubuntu/Debian installation checks, and full integration validation are the next required steps. Do not install this branch on a production host yet.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TARGET_BRANCH" --title "feat: fork Pterodactyl Panel v1.15.2 as SNCK" --body-file "$RUNNER_TEMP/pr-body.md" --draft

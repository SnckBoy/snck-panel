name: Import Pterodactyl v1.15.2 as SNCK

on:
  push:
    branches:
      - bootstrap/snck-pterodactyl-import

permissions:
  contents: write

concurrency:
  group: snck-pterodactyl-import
  cancel-in-progress: false

jobs:
  import-upstream:
    name: Create isolated SNCK fork branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out import bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare pinned upstream source
        env:
          UPSTREAM_COMMIT: 90b2aa87469da4fffd941b3c99f3c1ca48a01b78
        run: |
          set -euo pipefail
          cp scripts/rebrand-pterodactyl.py "$RUNNER_TEMP/rebrand-pterodactyl.py"
          git clone --filter=blob:none https://github.com/pterodactyl/panel.git "$RUNNER_TEMP/pterodactyl"
          git -C "$RUNNER_TEMP/pterodactyl" checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C "$RUNNER_TEMP/pterodactyl" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test -s "$RUNNER_TEMP/pterodactyl/LICENSE.md"

      - name: Build isolated SNCK fork branch
        env:
          TARGET_BRANCH: feat/snck-pterodactyl-v1.15.2
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create "$TARGET_BRANCH" origin/main
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$RUNNER_TEMP/pterodactyl/" "$GITHUB_WORKSPACE/"
          mkdir -p scripts
          cp "$RUNNER_TEMP/rebrand-pterodactyl.py" scripts/rebrand-pterodactyl.py
          python3 scripts/rebrand-pterodactyl.py "$GITHUB_WORKSPACE"
          test -s LICENSE.md
          test -s SNCK_UPSTREAM.md
          test -s public/assets/svgs/snck.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Pterodactyl Panel v1.15.2 as SNCK"
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Imported branch pushed. Create the review PR with the GitHub integration after the import run succeeds." >> "$GITHUB_STEP_SUMMARY"

name: Composer security refresh

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snck_panel_test
          POSTGRES_USER: snck_panel
          POSTGRES_PASSWORD: snck_panel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snck_panel -d snck_panel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        working-directory: laravel-panel
        run: composer validate --strict

      - name: Refresh vulnerable framework and transport packages
        working-directory: laravel-panel
        run: >-
          composer update
          laravel/framework
          phpseclib/phpseclib
          symfony/http-foundation
          symfony/http-kernel
          symfony/routing
          symfony/yaml
          --with-all-dependencies
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Audit the refreshed dependency graph
        working-directory: laravel-panel
        run: composer audit

      - name: Prepare Laravel environment
        working-directory: laravel-panel
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Apply Pint formatting to the legacy role service
        working-directory: laravel-panel
        run: ./vendor/bin/pint app/Services/AdminUserRoleService.php

      - name: Check PHP formatting
        working-directory: laravel-panel
        run: ./vendor/bin/pint --test

      - name: Analyze PHP types
        working-directory: laravel-panel
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1G --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laravel-panel/package-lock.json

      - name: Build Laravel frontend
        working-directory: laravel-panel
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Laravel feature tests
        working-directory: laravel-panel
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: snck_panel_test
          DB_USERNAME: snck_panel
          DB_PASSWORD: snck_panel
        run: php artisan test

      - name: Publish audited dependency update branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create security/composer-refresh
          git add laravel-panel/composer.lock laravel-panel/app/Services/AdminUserRoleService.php
          if git diff --cached --quiet; then
            echo "No dependency changes were produced." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "security: refresh vulnerable Composer dependencies"
            git push --force origin HEAD:refs/heads/security/composer-refresh
            echo "Published an audited update on `security/composer-refresh`. Review it and open a pull request into main." >> "$GITHUB_STEP_SUMMARY"
          fi

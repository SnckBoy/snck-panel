name: Composer security refresh

on:
  push:
    branches: [feat/hosting-audit-console]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snck_panel_test
          POSTGRES_USER: snck_panel
          POSTGRES_PASSWORD: snck_panel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snck_panel -d snck_panel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        working-directory: laravel-panel
        run: composer validate --strict

      - name: Refresh vulnerable framework and transport packages
        working-directory: laravel-panel
        run: >-
          composer update
          laravel/framework
          phpseclib/phpseclib
          symfony/http-foundation
          symfony/http-kernel
          symfony/routing
          symfony/yaml
          --with-all-dependencies
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Audit the refreshed dependency graph
        working-directory: laravel-panel
        run: composer audit

      - name: Prepare Laravel environment
        working-directory: laravel-panel
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP formatting
        working-directory: laravel-panel
        run: ./vendor/bin/pint --test

      - name: Analyze PHP types
        working-directory: laravel-panel
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1G --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laravel-panel/package-lock.json

      - name: Build Laravel frontend
        working-directory: laravel-panel
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Laravel feature tests
        working-directory: laravel-panel
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: snck_panel_test
          DB_USERNAME: snck_panel
          DB_PASSWORD: snck_panel
        run: php artisan test

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/composer-refresh
          delete-branch: true
          commit-message: "security: refresh vulnerable Composer dependencies"
          title: "security: refresh vulnerable Composer dependencies"
          body: |
            Automated Composer security refresh.

            This PR updates the Laravel framework, phpseclib and affected Symfony components.
            The Composer security audit must pass before the PR is merged. The normal SNCK Panel CI workflow
            runs formatting, static analysis, frontend build and PostgreSQL-backed feature tests.
